name: Build HorrorStack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync live GitHub UI into Android app
        run: cp index.html app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build safe test APK
        run: gradle :app:assembleSandbox --stacktrace -Dorg.gradle.jvmargs=-Xmx3g

      - name: Upload HorrorStack Test APK
        uses: actions/upload-artifact@v4
        with:
          name: HorrorStack-test
          path: app/build/outputs/apk/sandbox/app-sandbox.apk
          if-no-files-found: error
